name: Sync and Patch Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-and-patch-main
  cancel-in-progress: false

jobs:
  sync_and_patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/AndyNew2/hacs-APsystemsEZ1_local.git
          else
            git remote add upstream https://github.com/AndyNew2/hacs-APsystemsEZ1_local.git
          fi

          git fetch upstream main

      - name: Merge upstream changes
        run: |
          set -euo pipefail

          # Upstream-Dateien übernehmen; unsere Fork-Anpassungen werden anschließend
          # in einem eigenen, idempotenten Patch-Schritt erneut angewendet.
          git merge upstream/main \
            --allow-unrelated-histories \
            --strategy-option theirs \
            --no-commit || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Nicht automatisch auflösbare Merge-Konflikte:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

      - name: Apply fork patches
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import shutil
          from pathlib import Path


          class ForkPatcher:
              """Apply the persistent identity changes of this Home Assistant fork."""

              TARGET_DOMAIN = "apsystems"
              TARGET_NAME = "APsystems"
              FORK_CODEOWNER = "@thowiegit"

              UPSTREAM_OWNER = "AndyNew2"
              UPSTREAM_REPO = "hacs-APsystemsEZ1_local"

              COMPONENT_ROOT = Path("custom_components")
              TARGET_COMPONENT_DIR = COMPONENT_ROOT / TARGET_DOMAIN
              UPSTREAM_COMPONENT_DIRS = (
                  COMPONENT_ROOT / "apsystemapi_local",
                  COMPONENT_ROOT / "apsystemsapi_local",
              )

              README_PATH = Path("README.md")

              def __init__(self, github_repository: str) -> None:
                  if "/" not in github_repository:
                      raise SystemExit(
                          "GITHUB_REPOSITORY fehlt oder ist ungültig"
                      )

                  self.fork_owner, self.fork_repo = github_repository.split(
                      "/", 1
                  )
                  self.fork_full = github_repository
                  self.upstream_full = (
                      f"{self.UPSTREAM_OWNER}/{self.UPSTREAM_REPO}"
                  )

              def run(self) -> None:
                  self.patch_component_directory()
                  self.patch_component_domain_references()
                  self.patch_manifest()
                  self.patch_readme()

              def patch_component_directory(self) -> None:
                  """Move the current upstream component to the Core domain path."""
                  source_dirs = [
                      path for path in self.UPSTREAM_COMPONENT_DIRS if path.is_dir()
                  ]

                  if len(source_dirs) > 1:
                      raise SystemExit(
                          "Mehrere mögliche Upstream-Komponentenverzeichnisse "
                          "gefunden: "
                          + ", ".join(str(path) for path in source_dirs)
                      )

                  if source_dirs:
                      source_dir = source_dirs[0]
                      if self.TARGET_COMPONENT_DIR.exists():
                          shutil.rmtree(self.TARGET_COMPONENT_DIR)
                      source_dir.rename(self.TARGET_COMPONENT_DIR)
                  elif not self.TARGET_COMPONENT_DIR.is_dir():
                      expected = [
                          *self.UPSTREAM_COMPONENT_DIRS,
                          self.TARGET_COMPONENT_DIR,
                      ]
                      raise SystemExit(
                          "Kein Komponentenverzeichnis gefunden; erwartet wurde "
                          "eines von: "
                          + ", ".join(str(path) for path in expected)
                      )

              def patch_component_domain_references(self) -> None:
                  """Replace the upstream domain in all UTF-8 component files."""
                  replacements = {
                      "apsystemsapi_local": self.TARGET_DOMAIN,
                  }

                  for path in self.TARGET_COMPONENT_DIR.rglob("*"):
                      if not path.is_file():
                          continue

                      try:
                          original = path.read_text(encoding="utf-8")
                      except UnicodeDecodeError:
                          continue

                      patched = original
                      for old, new in replacements.items():
                          patched = patched.replace(old, new)

                      if patched != original:
                          path.write_text(patched, encoding="utf-8")

              def patch_manifest(self) -> None:
                  """Patch manifest.json structurally and keep upstream metadata."""
                  manifest_path = self.TARGET_COMPONENT_DIR / "manifest.json"
                  if not manifest_path.is_file():
                      raise SystemExit(f"Fehlende Datei: {manifest_path}")

                  manifest = json.loads(
                      manifest_path.read_text(encoding="utf-8")
                  )
                  manifest["domain"] = self.TARGET_DOMAIN
                  manifest["name"] = self.TARGET_NAME

                  codeowners = manifest.get("codeowners", [])
                  if not isinstance(codeowners, list):
                      raise SystemExit(
                          'manifest.json: "codeowners" ist keine Liste'
                      )

                  # Preserve upstream owners, remove all duplicate fork entries,
                  # and insert the fork owner exactly once at the front.
                  cleaned_codeowners: list[str] = []
                  for owner in codeowners:
                      if owner == self.FORK_CODEOWNER:
                          continue
                      if owner not in cleaned_codeowners:
                          cleaned_codeowners.append(owner)

                  manifest["codeowners"] = [
                      self.FORK_CODEOWNER,
                      *cleaned_codeowners,
                  ]

                  manifest_path.write_text(
                      json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8",
                  )

              def patch_readme(self) -> None:
                  """Patch repository identity and user-facing installation text."""
                  if not self.README_PATH.is_file():
                      raise SystemExit("Fehlende Datei: README.md")

                  text = self.README_PATH.read_text(encoding="utf-8")
                  text = self._patch_readme_heading(text)
                  text = self._patch_readme_home_assistant_identity(text)
                  text = self._patch_readme_repository_identity(text)
                  text = self._patch_readme_badges_and_references(text)

                  self.README_PATH.write_text(text, encoding="utf-8")

              def _patch_readme_heading(self, text: str) -> str:
                  """Set exactly the first H1 to the current repository name."""
                  text, count = re.subn(
                      r"(?m)^#\s+hacs-APsystems(?:EZ1_local(?:_API)*)?\s*$",
                      f"# {self.fork_repo}",
                      text,
                      count=1,
                  )
                  if count == 0:
                      text, count = re.subn(
                          r"(?m)^#\s+[^\n]+$",
                          f"# {self.fork_repo}",
                          text,
                          count=1,
                      )
                  if count == 0:
                      text = f"# {self.fork_repo}\n\n{text}"
                  return text

              def _patch_readme_home_assistant_identity(self, text: str) -> str:
                  """Align the documentation with the Core-overriding integration."""
                  text = text.replace("apsystemsapi_local", self.TARGET_DOMAIN)

                  # The fork deliberately appears as "APsystems" in Home Assistant.
                  # Replace the obsolete parallel-integration name regardless of
                  # line number or occurrence count.
                  text = text.replace("APsystems Local API", self.TARGET_NAME)

                  # This warning belonged to the former parallel installation and
                  # is now incorrect because this fork overrides the Core integration.
                  text = re.sub(
                      r"\s*\(\s*nicht\s+die\s+APsystems\s+nehmen\s*\)",
                      "",
                      text,
                      flags=re.IGNORECASE,
                  )

                  # Preserve the upstream project description where appropriate.
                  text = text.replace(
                      "APsystems EZ1 local Integration",
                      "APsystems EZ1 local API Integration",
                  )
                  text = text.replace(
                      "popular EZ1 Microinverter to fix",
                      "popular EZ1 Microinverter Integration to fix",
                  )
                  return text

              def _patch_readme_repository_identity(self, text: str) -> str:
                  """Point all HACS installation instructions to this fork."""
                  text = re.sub(
                      r"owner=[^&\s)]+&repository=hacs-APsystemsEZ1_local(?:_API)?",
                      (
                          f"owner={self.fork_owner}"
                          f"&repository={self.fork_repo}"
                      ),
                      text,
                  )

                  text = re.sub(
                      r"`(?:[^`/]+/)?hacs-APsystemsEZ1_local(?:_API)?`",
                      f"`{self.fork_full}`",
                      text,
                  )
                  return text

              def _patch_readme_badges_and_references(self, text: str) -> str:
                  """Rebuild managed badge links without duplicating entries."""
                  references = {
                      "commits-shield": (
                          "https://img.shields.io/github/commit-activity/y/"
                          f"{self.fork_full}.svg?style=for-the-badge"
                      ),
                      "commits": (
                          f"https://github.com/{self.fork_full}/commits"
                      ),
                      "license-shield": (
                          "https://img.shields.io/github/license/"
                          f"{self.fork_full}.svg?style=for-the-badge"
                      ),
                      "releases-shield": (
                          "https://img.shields.io/github/release/"
                          f"{self.fork_full}.svg?style=for-the-badge"
                      ),
                      "releases": (
                          f"https://github.com/{self.fork_full}/releases"
                      ),
                      "upstream-shield": (
                          "https://img.shields.io/github/v/release/"
                          f"{self.upstream_full}?label=upstream%20version"
                          "&style=for-the-badge"
                      ),
                      "upstream-repo": (
                          f"https://github.com/{self.upstream_full}"
                      ),
                  }

                  upstream_badge = (
                      "[![Upstream Release][upstream-shield]][upstream-repo]"
                  )
                  release_badge = (
                      "[![GitHub Release][releases-shield]][releases]"
                  )

                  text = re.sub(
                      rf"(?m)^\s*{re.escape(upstream_badge)}\s*$\n?",
                      "",
                      text,
                  )
                  if release_badge in text:
                      text = text.replace(
                          release_badge,
                          f"{release_badge}\n{upstream_badge}",
                          1,
                      )
                  else:
                      text = f"{upstream_badge}\n{text}"

                  managed_names = "|".join(
                      re.escape(name) for name in references
                  )
                  text = re.sub(
                      rf"(?m)^\[(?:{managed_names})\]:[^\n]*(?:\n|$)",
                      "",
                      text,
                  )

                  text = text.rstrip() + "\n\n"
                  text += "\n".join(
                      f"[{name}]: {url}"
                      for name, url in references.items()
                  )
                  return text + "\n"


          ForkPatcher(os.environ.get("GITHUB_REPOSITORY", "")).run()
          PY

      - name: Validate fork patches
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          manifest = json.loads(
              Path("custom_components/apsystems/manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          errors = []

          if manifest.get("domain") != "apsystems":
              errors.append('manifest.json: domain ist nicht "apsystems"')
          if manifest.get("name") != "APsystems":
              errors.append('manifest.json: name ist nicht "APsystems"')
          if manifest.get("codeowners", []).count("@thowiegit") != 1:
              errors.append(
                  'manifest.json: "@thowiegit" muss in codeowners exakt einmal vorkommen'
              )

          component_dir = Path("custom_components/apsystems")
          if not component_dir.is_dir():
              errors.append("Komponentenverzeichnis custom_components/apsystems fehlt")
          else:
              for path in component_dir.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "apsystemsapi_local" in content:
                      errors.append(
                          f"Alte Domain apsystemsapi_local verblieb in {path}"
                      )

          for obsolete_dir in (
              Path("custom_components/apsystemapi_local"),
              Path("custom_components/apsystemsapi_local"),
          ):
              if obsolete_dir.exists():
                  errors.append(
                      f"Altes Komponentenverzeichnis ist noch vorhanden: {obsolete_dir}"
                  )

          github_repository = os.environ.get("GITHUB_REPOSITORY", "")
          if "/" not in github_repository:
              errors.append("GITHUB_REPOSITORY fehlt oder ist ungültig")
              fork_owner = ""
              fork_repo = ""
          else:
              fork_owner, fork_repo = github_repository.split("/", 1)

          expected_heading = f"# {fork_repo}"
          if not readme.startswith(expected_heading + "\n"):
              errors.append("README.md: falsche erste Überschrift")

          required = [
              f"owner={fork_owner}&repository={fork_repo}",
              f"`{fork_owner}/{fork_repo}`",
              "redirect/config_flow_start/?domain=apsystems",
              'Unterverzeichnis mit dem Namen "apsystems"',
              "[upstream-repo]: https://github.com/AndyNew2/hacs-APsystemsEZ1_local",
          ]
          for value in required:
              if value not in readme:
                  errors.append(f"README.md: erforderlicher Inhalt fehlt: {value}")

          forbidden_patterns = {
              "alter HACS-Owner": r"owner=AndyNew2&repository=",
              "alte HACS-Repository-Anweisung": (
                  r"`AndyNew2/hacs-APsystemsEZ1_local(?:_API)?`"
              ),
              "alte Domain": r"apsystemsapi_local",
              "vervielfachter Titel": r"^# .*_API_API",
              "falscher Integrationsname": r"APsystems Local API",
              "veralteten Auswahlhinweis": (
                  r"\(\s*nicht\s+die\s+APsystems\s+nehmen\s*\)"
              ),
          }
          for label, pattern in forbidden_patterns.items():
              if re.search(pattern, readme, flags=re.MULTILINE):
                  errors.append(f"README.md enthält {label}")

          if readme.count(
              "[![Upstream Release][upstream-shield]][upstream-repo]"
          ) != 1:
              errors.append("README.md: Upstream-Badge ist nicht exakt einmal vorhanden")

          if errors:
              print("Patch-Validierung fehlgeschlagen:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)

          print("Patch-Validierung erfolgreich.")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail

          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-Patch: sync upstream and apply fork identity"

          # Der Workflow kann von einem älteren Run erneut gestartet worden sein
          # oder main kann sich während des Jobs geändert haben. Deshalb den
          # aktuellen Remote-Stand unmittelbar vor dem Push integrieren.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
